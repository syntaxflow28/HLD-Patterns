<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="How a Bloom filter works">
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .ttl{font-size:18px;font-weight:700;fill:#0f172a}
    .sub{font-size:12.5px;fill:#64748b}
    .hd{font-size:13px;font-weight:700;fill:#0f172a}
    .b{font-size:11.5px;fill:#334155}
    .bit{font-size:10px;font-weight:700;fill:#0f172a}
    .idx{font-size:9px;fill:#94a3b8}
    .k{font-size:11.5px;font-weight:700}
  </style>
  <rect width="900" height="360" fill="#fbfcfd"/>
  <text class="ttl" x="24" y="32">Bloom filter — “definitely not present” or “probably present”, in a few bits per key</text>
  <text class="sub" x="24" y="52">Never a false negative. That one-sided error is what makes it safe as a pre-filter in front of an expensive lookup.</text>

  <!-- insert -->
  <text class="hd" x="24" y="86">1. Insert "alice"</text>
  <rect x="24" y="96" width="86" height="26" rx="5" fill="#2563eb"/>
  <text class="k" x="67" y="114" text-anchor="middle" fill="#ffffff">"alice"</text>
  <text class="b" x="122" y="106">h₁ → 2</text>
  <text class="b" x="122" y="120">h₂ → 6</text>
  <text class="b" x="182" y="106">h₃ → 11</text>

  <!-- bit array -->
  <g>
    <g fill="#e2e8f0" stroke="#cbd5e1">
      <rect x="270" y="92" width="34" height="34" rx="4"/><rect x="306" y="92" width="34" height="34" rx="4"/>
      <rect x="342" y="92" width="34" height="34" rx="4"/><rect x="378" y="92" width="34" height="34" rx="4"/>
      <rect x="414" y="92" width="34" height="34" rx="4"/><rect x="450" y="92" width="34" height="34" rx="4"/>
      <rect x="486" y="92" width="34" height="34" rx="4"/><rect x="522" y="92" width="34" height="34" rx="4"/>
      <rect x="558" y="92" width="34" height="34" rx="4"/><rect x="594" y="92" width="34" height="34" rx="4"/>
      <rect x="630" y="92" width="34" height="34" rx="4"/><rect x="666" y="92" width="34" height="34" rx="4"/>
      <rect x="702" y="92" width="34" height="34" rx="4"/><rect x="738" y="92" width="34" height="34" rx="4"/>
    </g>
    <rect x="342" y="92" width="34" height="34" rx="4" fill="#2563eb"/>
    <rect x="486" y="92" width="34" height="34" rx="4" fill="#2563eb"/>
    <rect x="666" y="92" width="34" height="34" rx="4" fill="#2563eb"/>
    <g class="bit" text-anchor="middle">
      <text x="287" y="114">0</text><text x="323" y="114">0</text><text x="359" y="114" fill="#fff">1</text>
      <text x="395" y="114">0</text><text x="431" y="114">0</text><text x="467" y="114">0</text>
      <text x="503" y="114" fill="#fff">1</text><text x="539" y="114">0</text><text x="575" y="114">0</text>
      <text x="611" y="114">0</text><text x="647" y="114">0</text><text x="683" y="114" fill="#fff">1</text>
      <text x="719" y="114">0</text><text x="755" y="114">0</text>
    </g>
    <g class="idx" text-anchor="middle">
      <text x="287" y="140">0</text><text x="323" y="140">1</text><text x="359" y="140">2</text>
      <text x="395" y="140">3</text><text x="431" y="140">4</text><text x="467" y="140">5</text>
      <text x="503" y="140">6</text><text x="539" y="140">7</text><text x="575" y="140">8</text>
      <text x="611" y="140">9</text><text x="647" y="140">10</text><text x="683" y="140">11</text>
      <text x="719" y="140">12</text><text x="755" y="140">13</text>
    </g>
  </g>

  <!-- query miss -->
  <text class="hd" x="24" y="182">2. Query "bob"</text>
  <rect x="24" y="192" width="86" height="26" rx="5" fill="#16a34a"/>
  <text class="k" x="67" y="210" text-anchor="middle" fill="#ffffff">"bob"</text>
  <text class="b" x="122" y="202">h₁ → 4</text>
  <text class="b" x="122" y="216">h₂ → 6</text>
  <text class="b" x="182" y="202">h₃ → 9</text>
  <rect x="270" y="188" width="606" height="34" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text class="b" x="286" y="210">bit 4 = <tspan font-weight="700">0</tspan> → at least one bit unset → <tspan font-weight="700" fill="#15803d">DEFINITELY NOT in the set. Skip the lookup.</tspan></text>

  <!-- query false positive -->
  <text class="hd" x="24" y="256">3. Query "carol"</text>
  <rect x="24" y="266" width="86" height="26" rx="5" fill="#d97706"/>
  <text class="k" x="67" y="284" text-anchor="middle" fill="#ffffff">"carol"</text>
  <text class="b" x="122" y="276">h₁ → 2</text>
  <text class="b" x="122" y="290">h₂ → 6</text>
  <text class="b" x="182" y="276">h₃ → 11</text>
  <rect x="270" y="262" width="606" height="34" rx="5" fill="#fef3c7" stroke="#fcd34d"/>
  <text class="b" x="286" y="284">all three bits = <tspan font-weight="700">1</tspan> (set by "alice") → <tspan font-weight="700" fill="#b45309">FALSE POSITIVE. Must still check the real store.</tspan></text>

  <rect x="24" y="312" width="852" height="36" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text class="b" x="40" y="330"><tspan font-weight="700">Sizing:</tspan> ~10 bits/key ≈ 1% false positives — 1 billion keys in ~1.2 GB. Optimal k ≈ (m/n)·ln2. No deletes (use a counting Bloom).</text>
  <text class="b" x="40" y="344"><tspan font-weight="700">Where it shows up:</tspan> LSM engines skipping SSTables · cache-penetration defence · crawler URL dedup · “already seen this post?” checks.</text>
</svg>
