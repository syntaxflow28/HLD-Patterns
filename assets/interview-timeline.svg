<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="45 minute HLD interview timeline with phase budgets">
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .ttl{font-size:18px;font-weight:700;fill:#0f172a}
    .sub{font-size:12.5px;fill:#64748b}
    .lbl{font-size:12.5px;font-weight:700;fill:#ffffff}
    .min{font-size:11px;fill:#94a3b8}
    .cap{font-size:11.5px;fill:#334155}
    .warn{font-size:11.5px;font-weight:600;fill:#b91c1c}
    .ok{font-size:11.5px;font-weight:600;fill:#15803d}
  </style>
  <rect width="900" height="300" fill="#fbfcfd"/>
  <text class="ttl" x="24" y="34">Time budget — a 45-minute HLD interview</text>
  <text class="sub" x="24" y="54">Losing control of time is the single most common reason strong engineers fail.</text>

  <!-- axis -->
  <line x1="60" y1="180" x2="860" y2="180" stroke="#cbd5e1" stroke-width="1"/>
  <g class="min" text-anchor="middle">
    <text x="60" y="198">0</text><text x="149" y="198">5</text><text x="238" y="198">10</text>
    <text x="327" y="198">15</text><text x="416" y="198">20</text><text x="505" y="198">25</text>
    <text x="594" y="198">30</text><text x="683" y="198">35</text><text x="772" y="198">40</text>
    <text x="860" y="198">45 min</text>
  </g>
  <g stroke="#e2e8f0">
    <line x1="149" y1="176" x2="149" y2="184"/><line x1="238" y1="176" x2="238" y2="184"/>
    <line x1="327" y1="176" x2="327" y2="184"/><line x1="416" y1="176" x2="416" y2="184"/>
    <line x1="505" y1="176" x2="505" y2="184"/><line x1="594" y1="176" x2="594" y2="184"/>
    <line x1="683" y1="176" x2="683" y2="184"/><line x1="772" y1="176" x2="772" y2="184"/>
  </g>

  <!-- bars : 17.8 px per minute -->
  <rect x="60"  y="128" width="89"  height="46" rx="6" fill="#0ea5e9"/>
  <text class="lbl" x="104" y="149" text-anchor="middle">Functional</text>
  <text class="lbl" x="104" y="164" text-anchor="middle">reqs</text>

  <rect x="151" y="128" width="87" height="46" rx="6" fill="#0284c7"/>
  <text class="lbl" x="194" y="149" text-anchor="middle">NFRs +</text>
  <text class="lbl" x="194" y="164" text-anchor="middle">estimation</text>

  <rect x="240" y="128" width="123" height="46" rx="6" fill="#7c3aed"/>
  <text class="lbl" x="301" y="149" text-anchor="middle">API +</text>
  <text class="lbl" x="301" y="164" text-anchor="middle">data model</text>

  <rect x="365" y="128" width="176" height="46" rx="6" fill="#6d28d9"/>
  <text class="lbl" x="453" y="155" text-anchor="middle">High-level architecture</text>

  <rect x="543" y="128" width="228" height="46" rx="6" fill="#059669"/>
  <text class="lbl" x="657" y="149" text-anchor="middle">Deep dive on 1–2 components</text>
  <text class="lbl" x="657" y="164" text-anchor="middle">(where the grade is decided)</text>

  <rect x="773" y="128" width="87" height="46" rx="6" fill="#d97706"/>
  <text class="lbl" x="816" y="149" text-anchor="middle">Failure +</text>
  <text class="lbl" x="816" y="164" text-anchor="middle">wrap-up</text>

  <!-- checkpoints -->
  <g stroke="#dc2626" stroke-dasharray="4 3">
    <line x1="238" y1="76" x2="238" y2="128"/>
    <line x1="416" y1="76" x2="416" y2="128"/>
  </g>
  <circle cx="238" cy="76" r="4" fill="#dc2626"/>
  <circle cx="416" cy="76" r="4" fill="#dc2626"/>
  <text class="warn" x="238" y="98" text-anchor="middle">min 12: no box drawn yet?</text>
  <text class="warn" x="238" y="112" text-anchor="middle">you are over-clarifying</text>
  <text class="warn" x="416" y="98" text-anchor="middle">min 20: no API written?</text>
  <text class="warn" x="416" y="112" text-anchor="middle">you are hand-waving</text>

  <!-- footer -->
  <rect x="60" y="222" width="800" height="52" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text class="cap" x="76" y="243">Rule: reserve the last 5 minutes. Ending with “here are the bottlenecks, failure modes, and what breaks at 10x”</text>
  <text class="cap" x="76" y="261">is worth more than five extra minutes of architecture detail nobody asked for.</text>
</svg>
