<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Reference architecture for a large scale web system">
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .ttl{font-size:18px;font-weight:700;fill:#0f172a}
    .sub{font-size:12.5px;fill:#64748b}
    .lyr{font-size:10.5px;font-weight:700;fill:#94a3b8;letter-spacing:.08em}
    .n{font-size:11px;font-weight:700;fill:#ffffff}
    .n2{font-size:9.5px;fill:#e2e8f0}
    .b{font-size:11px;fill:#334155}
    .sm{font-size:9.5px;fill:#64748b}
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d97706"/></marker>
  </defs>
  <rect width="900" height="470" fill="#fbfcfd"/>
  <text class="ttl" x="24" y="30">The reference architecture — draw this, then delete what the problem does not need</text>
  <text class="sub" x="24" y="50">Almost every system design answer is a subset of this. Knowing it cold means you never start from a blank page.</text>

  <!-- EDGE -->
  <text class="lyr" x="24" y="76">EDGE</text>
  <rect x="24" y="84" width="852" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="40" y="94" width="110" height="32" rx="5" fill="#0f172a"/>
  <text class="n" x="95" y="107" text-anchor="middle">Clients</text><text class="n2" x="95" y="120" text-anchor="middle">web · mobile · API</text>
  <rect x="180" y="94" width="110" height="32" rx="5" fill="#334155"/>
  <text class="n" x="235" y="107" text-anchor="middle">DNS + Anycast</text><text class="n2" x="235" y="120" text-anchor="middle">geo routing</text>
  <rect x="320" y="94" width="110" height="32" rx="5" fill="#334155"/>
  <text class="n" x="375" y="107" text-anchor="middle">CDN</text><text class="n2" x="375" y="120" text-anchor="middle">static + media</text>
  <rect x="460" y="94" width="110" height="32" rx="5" fill="#334155"/>
  <text class="n" x="515" y="107" text-anchor="middle">WAF / DDoS</text><text class="n2" x="515" y="120" text-anchor="middle">TLS termination</text>
  <rect x="600" y="94" width="110" height="32" rx="5" fill="#2563eb"/>
  <text class="n" x="655" y="107" text-anchor="middle">Load balancer</text><text class="n2" x="655" y="120" text-anchor="middle">L4 / L7 · health</text>
  <rect x="740" y="94" width="120" height="32" rx="5" fill="#2563eb"/>
  <text class="n" x="800" y="107" text-anchor="middle">API Gateway</text><text class="n2" x="800" y="120" text-anchor="middle">authn · rate limit</text>

  <line x1="450" y1="136" x2="450" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- SERVICES -->
  <text class="lyr" x="24" y="176">STATELESS SERVICES  ·  scale horizontally, no session affinity</text>
  <rect x="24" y="184" width="852" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="40" y="194" width="130" height="32" rx="5" fill="#2563eb"/>
  <text class="n" x="105" y="207" text-anchor="middle">Read service</text><text class="n2" x="105" y="220" text-anchor="middle">cache-heavy · 90% traffic</text>
  <rect x="186" y="194" width="130" height="32" rx="5" fill="#2563eb"/>
  <text class="n" x="251" y="207" text-anchor="middle">Write service</text><text class="n2" x="251" y="220" text-anchor="middle">validate · idempotent</text>
  <rect x="332" y="194" width="130" height="32" rx="5" fill="#2563eb"/>
  <text class="n" x="397" y="207" text-anchor="middle">Domain services</text><text class="n2" x="397" y="220" text-anchor="middle">user · content · billing</text>
  <rect x="478" y="194" width="130" height="32" rx="5" fill="#0891b2"/>
  <text class="n" x="543" y="207" text-anchor="middle">WebSocket gateway</text><text class="n2" x="543" y="220" text-anchor="middle">stateful · conn registry</text>
  <rect x="624" y="194" width="118" height="32" rx="5" fill="#7c3aed"/>
  <text class="n" x="683" y="207" text-anchor="middle">Search service</text><text class="n2" x="683" y="220" text-anchor="middle">inverted index</text>
  <rect x="758" y="194" width="102" height="32" rx="5" fill="#7c3aed"/>
  <text class="n" x="809" y="207" text-anchor="middle">ML / ranking</text><text class="n2" x="809" y="220" text-anchor="middle">feature store</text>

  <line x1="300" y1="236" x2="300" y2="266" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="640" y1="236" x2="640" y2="266" stroke="#d97706" stroke-width="1.5" marker-end="url(#ao)"/>
  <text class="sm" x="648" y="256" fill="#b45309">async path</text>

  <!-- DATA -->
  <text class="lyr" x="24" y="282">STATE  ·  the part you cannot just add nodes to</text>
  <rect x="24" y="290" width="590" height="96" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <rect x="40" y="300" width="130" height="34" rx="5" fill="#dc2626"/>
  <text class="n" x="105" y="313" text-anchor="middle">Cache — Redis</text><text class="n2" x="105" y="327" text-anchor="middle">hot keys · sessions · counters</text>
  <rect x="186" y="300" width="130" height="34" rx="5" fill="#16a34a"/>
  <text class="n" x="251" y="313" text-anchor="middle">OLTP — Postgres</text><text class="n2" x="251" y="327" text-anchor="middle">leader + read replicas</text>
  <rect x="332" y="300" width="130" height="34" rx="5" fill="#16a34a"/>
  <text class="n" x="397" y="313" text-anchor="middle">Wide-column</text><text class="n2" x="397" y="327" text-anchor="middle">Cassandra · huge writes</text>
  <rect x="478" y="300" width="120" height="34" rx="5" fill="#16a34a"/>
  <text class="n" x="538" y="313" text-anchor="middle">Blob — S3</text><text class="n2" x="538" y="327" text-anchor="middle">media · backups</text>

  <rect x="40" y="344" width="558" height="30" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text class="b" x="52" y="363"><tspan font-weight="700">Sharding key</tspan> chosen so the common query hits one shard  ·  <tspan font-weight="700">replicas</tspan> for HA  ·  <tspan font-weight="700">read-your-writes</tspan> via sticky reads after a write</text>

  <!-- ASYNC -->
  <rect x="626" y="290" width="250" height="96" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <rect x="642" y="300" width="218" height="30" rx="5" fill="#d97706"/>
  <text class="n" x="751" y="313" text-anchor="middle">Kafka — durable log</text><text class="n2" x="751" y="326" text-anchor="middle">replay · multiple consumers · ordering per key</text>
  <rect x="642" y="338" width="104" height="36" rx="5" fill="#ea580c"/>
  <text class="n" x="694" y="352" text-anchor="middle">Workers</text><text class="n2" x="694" y="366" text-anchor="middle">fan-out · email · thumbs</text>
  <rect x="756" y="338" width="104" height="36" rx="5" fill="#ea580c"/>
  <text class="n" x="808" y="352" text-anchor="middle">Scheduler</text><text class="n2" x="808" y="366" text-anchor="middle">cron · retries · DLQ</text>

  <!-- CROSS CUTTING -->
  <rect x="24" y="398" width="852" height="56" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text class="lyr" x="40" y="416">CROSS-CUTTING — mention these unprompted; it is a senior signal</text>
  <text class="b" x="40" y="436"><tspan font-weight="700">Observability:</tspan> RED/USE metrics · tracing · logs · SLOs + error budgets</text>
  <text class="b" x="40" y="450"><tspan font-weight="700">Resiliency:</tspan> timeouts · retries with jitter · circuit breakers · bulkheads</text>
  <text class="b" x="500" y="436"><tspan font-weight="700">Security:</tspan> authz at the gateway · encryption · tenant isolation</text>
  <text class="b" x="500" y="450"><tspan font-weight="700">Delivery:</tspan> canary + flags · expand/contract migrations · runbooks</text>
</svg>
