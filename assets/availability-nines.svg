<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Availability nines, downtime budgets and how serial dependencies multiply">
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .ttl{font-size:18px;font-weight:700;fill:#0f172a}
    .sub{font-size:12.5px;fill:#64748b}
    .hd{font-size:13px;font-weight:700;fill:#0f172a}
    .b{font-size:11.5px;fill:#334155}
    .n{font-size:12px;font-weight:700;fill:#ffffff}
    .sm{font-size:10.5px;fill:#64748b}
    .big{font-size:15px;font-weight:700}
  </style>
  <rect width="900" height="360" fill="#fbfcfd"/>
  <text class="ttl" x="24" y="32">Availability — each extra nine costs ~10× and removes every manual step</text>
  <text class="sub" x="24" y="52">Downtime per year, on a log scale. Note where “a human gets paged and fixes it” stops being possible.</text>

  <!-- bars -->
  <g>
    <text class="hd" x="120" y="94" text-anchor="end">99%</text>
    <rect x="132" y="80" width="470" height="20" rx="4" fill="#dc2626"/>
    <text class="n" x="146" y="95">3.65 days / year</text>
    <text class="sm" x="620" y="95">single node, restore from backup</text>

    <text class="hd" x="120" y="128" text-anchor="end">99.9%</text>
    <rect x="132" y="114" width="352" height="20" rx="4" fill="#ea580c"/>
    <text class="n" x="146" y="129">8.8 hours / year</text>
    <text class="sm" x="620" y="129">multi-AZ, automated failover</text>

    <text class="hd" x="120" y="162" text-anchor="end">99.95%</text>
    <rect x="132" y="148" width="304" height="20" rx="4" fill="#d97706"/>
    <text class="n" x="146" y="163">4.4 hours / year</text>
    <text class="sm" x="620" y="163">redundancy N+1, health-checked</text>

    <text class="hd" x="120" y="196" text-anchor="end">99.99%</text>
    <rect x="132" y="182" width="234" height="20" rx="4" fill="#16a34a"/>
    <text class="n" x="146" y="197">52 minutes / year</text>
    <text class="sm" x="620" y="197">no manual steps — 4 min/month budget</text>

    <text class="hd" x="120" y="230" text-anchor="end">99.999%</text>
    <rect x="132" y="216" width="116" height="20" rx="4" fill="#0891b2"/>
    <text class="n" x="146" y="231">5.3 min / year</text>
    <text class="sm" x="620" y="231">multi-region active-active, cells</text>
  </g>

  <line x1="366" y1="72" x2="366" y2="244" stroke="#0f172a" stroke-dasharray="4 3"/>
  <text class="sm" x="372" y="256" fill="#0f172a">← beyond this line a human cannot be in the recovery path</text>

  <!-- serial vs parallel -->
  <rect x="24" y="272" width="418" height="76" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text class="hd" x="44" y="294" fill="#991b1b">Serial dependencies MULTIPLY</text>
  <g>
    <rect x="44" y="304" width="76" height="24" rx="4" fill="#f87171"/><text class="n" x="82" y="320" text-anchor="middle">99.9%</text>
    <text class="big" x="128" y="322" fill="#991b1b">×</text>
    <rect x="142" y="304" width="76" height="24" rx="4" fill="#f87171"/><text class="n" x="180" y="320" text-anchor="middle">99.9%</text>
    <text class="big" x="226" y="322" fill="#991b1b">×</text>
    <rect x="240" y="304" width="76" height="24" rx="4" fill="#f87171"/><text class="n" x="278" y="320" text-anchor="middle">99.9%</text>
    <text class="big" x="324" y="322" fill="#991b1b">=</text>
    <rect x="340" y="304" width="86" height="24" rx="4" fill="#b91c1c"/><text class="n" x="383" y="320" text-anchor="middle">99.7%</text>
  </g>
  <text class="sm" x="44" y="344">→ the argument for fewer synchronous hops, caches as fallbacks, and making non-critical calls async.</text>

  <rect x="458" y="272" width="418" height="76" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text class="hd" x="478" y="294" fill="#14532d">Redundancy ADDS nines</text>
  <g>
    <rect x="478" y="302" width="76" height="20" rx="4" fill="#4ade80"/><text class="n" x="516" y="316" text-anchor="middle">99%</text>
    <rect x="478" y="324" width="76" height="20" rx="4" fill="#4ade80"/><text class="n" x="516" y="338" text-anchor="middle">99%</text>
    <text class="b" x="566" y="322">in parallel → 1 − (0.01)² =</text>
    <rect x="712" y="312" width="86" height="24" rx="4" fill="#15803d"/><text class="n" x="755" y="328" text-anchor="middle">99.99%</text>
  </g>
  <text class="sm" x="478" y="292"> </text>
</svg>
