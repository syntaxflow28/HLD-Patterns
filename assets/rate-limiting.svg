<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Rate limiting algorithms compared, including the fixed window boundary burst problem">
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .ttl{font-size:18px;font-weight:700;fill:#0f172a}
    .sub{font-size:12.5px;fill:#64748b}
    .hd{font-size:13px;font-weight:700;fill:#0f172a}
    .b{font-size:11px;fill:#334155}
    .sm{font-size:10px;fill:#64748b}
    .n{font-size:10.5px;font-weight:700;fill:#ffffff}
    .warn{font-size:11.5px;font-weight:700;fill:#b91c1c}
  </style>
  <rect width="900" height="400" fill="#fbfcfd"/>
  <text class="ttl" x="24" y="32">Rate limiting — token bucket, and why fixed windows leak 2× the limit</text>
  <text class="sub" x="24" y="52">Limit = 100 requests per minute in all three examples below.</text>

  <!-- TOKEN BUCKET -->
  <rect x="24" y="72" width="418" height="150" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="hd" x="44" y="96">Token bucket — the default you should quote</text>

  <!-- refill -->
  <path d="M70,112 L70,128" stroke="#0891b2" stroke-width="2" marker-end="url(#r1)"/>
  <defs><marker id="r1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0891b2"/></marker></defs>
  <text class="sm" x="82" y="122">refill r = 100/min</text>

  <!-- bucket -->
  <path d="M52,132 L52,196 L110,196 L110,132" fill="none" stroke="#2563eb" stroke-width="2"/>
  <rect x="54" y="158" width="54" height="37" fill="#60a5fa"/>
  <g fill="#1d4ed8">
    <circle cx="66" cy="168" r="4"/><circle cx="80" cy="166" r="4"/><circle cx="94" cy="170" r="4"/>
    <circle cx="70" cy="182" r="4"/><circle cx="88" cy="184" r="4"/>
  </g>
  <text class="sm" x="81" y="212" text-anchor="middle">capacity B = 100</text>

  <line x1="112" y1="176" x2="150" y2="176" stroke="#2563eb" stroke-width="2" marker-end="url(#r2)"/>
  <defs><marker id="r2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker></defs>
  <text class="sm" x="131" y="170" text-anchor="middle">1 token</text>
  <text class="sm" x="131" y="194" text-anchor="middle">per request</text>

  <rect x="156" y="140" width="120" height="30" rx="5" fill="#16a34a"/>
  <text class="n" x="216" y="159" text-anchor="middle">tokens &gt; 0 → ALLOW</text>
  <rect x="156" y="180" width="120" height="30" rx="5" fill="#dc2626"/>
  <text class="n" x="216" y="199" text-anchor="middle">empty → 429</text>

  <text class="b" x="292" y="130" font-weight="700">B controls burst size</text>
  <text class="b" x="292" y="146">r controls sustained rate</text>
  <text class="sm" x="292" y="168">Idle clients accumulate</text>
  <text class="sm" x="292" y="182">tokens, so they can burst —</text>
  <text class="sm" x="292" y="196">usually what you want.</text>
  <text class="sm" x="292" y="212">Leaky bucket: smooths output.</text>

  <!-- FIXED WINDOW PROBLEM -->
  <rect x="458" y="72" width="418" height="150" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text class="hd" x="478" y="96">Fixed window — the boundary burst</text>

  <line x1="478" y1="180" x2="856" y2="180" stroke="#cbd5e1"/>
  <rect x="478" y="112" width="180" height="68" fill="#fee2e2" stroke="#fca5a5" stroke-dasharray="4 3"/>
  <rect x="662" y="112" width="180" height="68" fill="#fee2e2" stroke="#fca5a5" stroke-dasharray="4 3"/>
  <text class="sm" x="568" y="196" text-anchor="middle">window 10:00–10:01</text>
  <text class="sm" x="752" y="196" text-anchor="middle">window 10:01–10:02</text>

  <rect x="600" y="130" width="56" height="48" rx="4" fill="#dc2626"/>
  <text class="n" x="628" y="158" text-anchor="middle">100</text>
  <rect x="664" y="130" width="56" height="48" rx="4" fill="#dc2626"/>
  <text class="n" x="692" y="158" text-anchor="middle">100</text>

  <path d="M600,120 L720,120" stroke="#b91c1c" stroke-width="2"/>
  <path d="M600,116 L600,124 M720,116 L720,124" stroke="#b91c1c" stroke-width="2"/>
  <text class="warn" x="660" y="112" text-anchor="middle">200 requests in 2 seconds</text>
  <text class="b" x="478" y="216">Both windows are “within limit”, yet the client got 2× the rate.</text>

  <!-- SLIDING -->
  <rect x="24" y="238" width="852" height="112" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="hd" x="44" y="262">Fixing it — pick your accuracy/memory trade-off</text>
  <g class="b">
    <text x="44" y="286" font-weight="700">Sliding window log</text>
    <text x="200" y="286">store every request timestamp in a sorted set; count those in the last 60 s</text>
    <text x="640" y="286" fill="#15803d">exact</text><text x="710" y="286" fill="#b91c1c">O(requests) memory</text>

    <text x="44" y="308" font-weight="700">Sliding window counter</text>
    <text x="200" y="308">weighted blend: <tspan font-family="monospace">prev·(1−elapsed) + curr</tspan> — two integers per key</text>
    <text x="640" y="308" fill="#15803d">~99% accurate</text><text x="710" y="308" fill="#15803d">O(1) memory ← best default</text>

    <text x="44" y="330" font-weight="700">Token bucket</text>
    <text x="200" y="330">two fields per key: token count + last refill timestamp</text>
    <text x="640" y="330" fill="#15803d">burst-aware</text><text x="710" y="330" fill="#15803d">O(1) memory</text>
  </g>

  <rect x="24" y="352" width="852" height="40" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text class="b" x="40" y="370"><tspan font-weight="700">Distributed:</tspan> a Redis Lua script makes check-and-decrement atomic. Better still, each node leases a slice of the global budget.</text>
  <text class="b" x="40" y="386"><tspan font-weight="700">Decide the failure mode up front:</tspan> fail open for availability, fail closed for abuse-critical endpoints.</text>
</svg>
