<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Replication versus partitioning, two different mechanisms often confused">
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .ttl{font-size:18px;font-weight:700;fill:#0f172a}
    .sub{font-size:12.5px;fill:#64748b}
    .hd{font-size:14px;font-weight:700}
    .b{font-size:11.5px;fill:#334155}
    .n{font-size:11px;font-weight:700;fill:#ffffff}
    .cap{font-size:11px;font-style:italic;fill:#64748b}
  </style>
  <rect width="900" height="360" fill="#fbfcfd"/>
  <text class="ttl" x="24" y="32">Replication ≠ Partitioning — and real systems need both</text>
  <text class="sub" x="24" y="52">Replication copies the same data for availability and read scale. Partitioning splits different data for write and storage scale.</text>

  <!-- LEFT: replication -->
  <rect x="24" y="72" width="410" height="266" rx="10" fill="#f0f9ff" stroke="#7dd3fc"/>
  <text class="hd" x="44" y="98" fill="#075985">REPLICATION — same data, N copies</text>
  <text class="cap" x="44" y="116">Buys: availability, read throughput, disaster recovery</text>

  <rect x="150" y="130" width="150" height="40" rx="7" fill="#0284c7"/>
  <text class="n" x="225" y="148" text-anchor="middle">LEADER</text>
  <text class="n" x="225" y="163" text-anchor="middle">rows 1…1000</text>

  <line x1="190" y1="170" x2="110" y2="212" stroke="#0284c7" stroke-width="2" marker-end="url(#b1)"/>
  <line x1="225" y1="170" x2="225" y2="212" stroke="#0284c7" stroke-width="2" marker-end="url(#b1)"/>
  <line x1="260" y1="170" x2="340" y2="212" stroke="#0284c7" stroke-width="2" marker-end="url(#b1)"/>
  <defs><marker id="b1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0284c7"/></marker></defs>

  <rect x="48" y="216" width="122" height="40" rx="7" fill="#38bdf8"/>
  <text class="n" x="109" y="234" text-anchor="middle">REPLICA</text>
  <text class="n" x="109" y="249" text-anchor="middle">rows 1…1000</text>
  <rect x="180" y="216" width="90" height="40" rx="7" fill="#38bdf8"/>
  <text class="n" x="225" y="234" text-anchor="middle">REPLICA</text>
  <text class="n" x="225" y="249" text-anchor="middle">1…1000</text>
  <rect x="280" y="216" width="122" height="40" rx="7" fill="#38bdf8"/>
  <text class="n" x="341" y="234" text-anchor="middle">REPLICA</text>
  <text class="n" x="341" y="249" text-anchor="middle">rows 1…1000</text>

  <text class="b" x="44" y="286">✔ Any replica can answer a read → read QPS scales</text>
  <text class="b" x="44" y="304">✘ Write throughput does NOT scale — one leader still takes every write</text>
  <text class="b" x="44" y="322">✘ Introduces replication lag → stale reads</text>

  <!-- RIGHT: partitioning -->
  <rect x="452" y="72" width="424" height="266" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text class="hd" x="472" y="98" fill="#9a3412">PARTITIONING — different data, N shards</text>
  <text class="cap" x="472" y="116">Buys: write throughput, storage capacity, smaller indexes</text>

  <rect x="580" y="130" width="168" height="34" rx="7" fill="#94a3b8"/>
  <text class="n" x="664" y="152" text-anchor="middle">ROUTER — shard(key)</text>

  <line x1="610" y1="164" x2="522" y2="212" stroke="#ea580c" stroke-width="2" marker-end="url(#b2)"/>
  <line x1="645" y1="164" x2="620" y2="212" stroke="#ea580c" stroke-width="2" marker-end="url(#b2)"/>
  <line x1="683" y1="164" x2="718" y2="212" stroke="#ea580c" stroke-width="2" marker-end="url(#b2)"/>
  <line x1="718" y1="164" x2="816" y2="212" stroke="#ea580c" stroke-width="2" marker-end="url(#b2)"/>
  <defs><marker id="b2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ea580c"/></marker></defs>

  <rect x="472" y="216" width="94" height="40" rx="7" fill="#ea580c"/>
  <text class="n" x="519" y="234" text-anchor="middle">SHARD 1</text>
  <text class="n" x="519" y="249" text-anchor="middle">rows 1…250</text>
  <rect x="574" y="216" width="94" height="40" rx="7" fill="#f97316"/>
  <text class="n" x="621" y="234" text-anchor="middle">SHARD 2</text>
  <text class="n" x="621" y="249" text-anchor="middle">251…500</text>
  <rect x="676" y="216" width="94" height="40" rx="7" fill="#fb923c"/>
  <text class="n" x="723" y="234" text-anchor="middle">SHARD 3</text>
  <text class="n" x="723" y="249" text-anchor="middle">501…750</text>
  <rect x="778" y="216" width="80" height="40" rx="7" fill="#fdba74"/>
  <text class="n" x="818" y="234" text-anchor="middle">SHARD 4</text>
  <text class="n" x="818" y="249" text-anchor="middle">751…1000</text>

  <text class="b" x="472" y="286">✔ Write throughput and storage scale linearly with shards</text>
  <text class="b" x="472" y="304">✘ Cross-shard queries become scatter-gather; the slowest shard sets latency</text>
  <text class="b" x="472" y="322">✘ Each shard is now a single point of failure — so you replicate each shard too</text>

  <text class="sub" x="450" y="354" text-anchor="middle">Production answer: “N shards, each a 3-node replica set.” Say both words, never one as a substitute for the other.</text>
</svg>
