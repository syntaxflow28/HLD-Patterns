<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Object storage lifecycle tiers with cost and retrieval time">
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .ttl{font-size:18px;font-weight:700;fill:#0f172a}
    .sub{font-size:12.5px;fill:#64748b}
    .n{font-size:13px;font-weight:700;fill:#ffffff}
    .p{font-size:11px;fill:#ffffff}
    .b{font-size:11.5px;fill:#334155}
    .hd{font-size:11px;font-weight:700;fill:#64748b;letter-spacing:.04em}
  </style>
  <rect width="900" height="320" fill="#fbfcfd"/>
  <text class="ttl" x="24" y="32">Storage tiering — the cheapest byte is the one you moved to cold storage</text>
  <text class="sub" x="24" y="52">Lifecycle policies are a one-line config change that can cut a multi-petabyte bill by 80%. Almost nobody mentions this.</text>

  <text class="hd" x="24" y="82">AGE OF DATA →</text>

  <!-- tiers -->
  <rect x="24" y="94" width="196" height="96" rx="10" fill="#dc2626"/>
  <text class="n" x="122" y="120" text-anchor="middle">HOT · Standard</text>
  <text class="p" x="122" y="140" text-anchor="middle">~$0.023 /GB-month</text>
  <text class="p" x="122" y="158" text-anchor="middle">retrieval: instant</text>
  <text class="p" x="122" y="176" text-anchor="middle">day 0 – 30</text>

  <rect x="228" y="94" width="196" height="96" rx="10" fill="#ea580c"/>
  <text class="n" x="326" y="120" text-anchor="middle">WARM · Infrequent</text>
  <text class="p" x="326" y="140" text-anchor="middle">~$0.0125 /GB-month</text>
  <text class="p" x="326" y="158" text-anchor="middle">retrieval: instant + fee</text>
  <text class="p" x="326" y="176" text-anchor="middle">day 30 – 90</text>

  <rect x="432" y="94" width="196" height="96" rx="10" fill="#0891b2"/>
  <text class="n" x="530" y="120" text-anchor="middle">COLD · Glacier IR</text>
  <text class="p" x="530" y="140" text-anchor="middle">~$0.004 /GB-month</text>
  <text class="p" x="530" y="158" text-anchor="middle">retrieval: minutes</text>
  <text class="p" x="530" y="176" text-anchor="middle">day 90 – 365</text>

  <rect x="636" y="94" width="240" height="96" rx="10" fill="#1e40af"/>
  <text class="n" x="756" y="120" text-anchor="middle">ARCHIVE · Deep Archive</text>
  <text class="p" x="756" y="140" text-anchor="middle">~$0.00099 /GB-month (≈ 4% of hot)</text>
  <text class="p" x="756" y="158" text-anchor="middle">retrieval: hours</text>
  <text class="p" x="756" y="176" text-anchor="middle">1 year +</text>

  <g stroke="#94a3b8" stroke-width="2">
    <line x1="220" y1="142" x2="226" y2="142" marker-end="url(#t1)"/>
    <line x1="424" y1="142" x2="430" y2="142" marker-end="url(#t1)"/>
    <line x1="628" y1="142" x2="634" y2="142" marker-end="url(#t1)"/>
  </g>
  <defs><marker id="t1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker></defs>

  <!-- durability vs replication -->
  <rect x="24" y="206" width="418" height="94" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text class="b" x="40" y="228" font-weight="700">Replication vs erasure coding</text>
  <text class="b" x="40" y="248">3× replication → 200% storage overhead, simple, fast repair.</text>
  <text class="b" x="40" y="266">Reed-Solomon 10+4 → ~40% overhead, same durability, more</text>
  <text class="b" x="40" y="284">CPU and slower reconstruction. This is how S3 gets 11 nines cheaply.</text>

  <rect x="458" y="206" width="418" height="94" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text class="b" x="474" y="228" font-weight="700">The cost nobody estimates: egress</text>
  <text class="b" x="474" y="248">Storage ≈ $0.023/GB-month. Internet egress ≈ $0.05–0.09 <tspan font-weight="700">per GB served</tspan>.</text>
  <text class="b" x="474" y="266">A 1 GB file stored for a year costs ~$0.28; served 10,000 times it costs ~$700.</text>
  <text class="b" x="474" y="284">→ CDN hit rate is a <tspan font-weight="700">cost</tspan> metric, not just a latency metric.</text>
</svg>
