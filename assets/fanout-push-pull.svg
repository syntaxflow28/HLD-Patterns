<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Fan-out on write versus fan-out on read versus the hybrid approach">
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .ttl{font-size:18px;font-weight:700;fill:#0f172a}
    .sub{font-size:12.5px;fill:#64748b}
    .hd{font-size:13.5px;font-weight:700}
    .b{font-size:11px;fill:#334155}
    .sm{font-size:10px;fill:#64748b}
    .n{font-size:10px;font-weight:700;fill:#ffffff}
    .cost{font-size:11px;font-weight:700}
  </style>
  <rect width="900" height="420" fill="#fbfcfd"/>
  <text class="ttl" x="24" y="32">Fan-out: push vs pull vs hybrid — and why celebrities force the answer</text>
  <text class="sub" x="24" y="52">Applies to feeds, notifications, group chat, and activity streams. Decide with four inputs: read:write ratio, follower distribution, active-user fraction, freshness budget.</text>

  <!-- PUSH -->
  <rect x="24" y="72" width="276" height="230" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="hd" x="44" y="96" fill="#1e3a8a">PUSH — fan-out on write</text>
  <rect x="48" y="110" width="70" height="26" rx="5" fill="#2563eb"/>
  <text class="n" x="83" y="127" text-anchor="middle">post</text>
  <g stroke="#2563eb" stroke-width="1.5">
    <line x1="118" y1="123" x2="176" y2="152"/><line x1="118" y1="123" x2="176" y2="176"/>
    <line x1="118" y1="123" x2="176" y2="200"/><line x1="118" y1="123" x2="176" y2="224"/>
    <line x1="118" y1="123" x2="176" y2="248"/>
  </g>
  <g fill="#60a5fa">
    <rect x="180" y="144" width="92" height="16" rx="3"/><rect x="180" y="168" width="92" height="16" rx="3"/>
    <rect x="180" y="192" width="92" height="16" rx="3"/><rect x="180" y="216" width="92" height="16" rx="3"/>
    <rect x="180" y="240" width="92" height="16" rx="3"/>
  </g>
  <text class="sm" x="226" y="156" text-anchor="middle" fill="#fff">follower timeline</text>
  <text class="sm" x="226" y="272" text-anchor="middle">…× 200 followers</text>
  <text class="cost" x="44" y="292" fill="#15803d">READ = O(1) ✔</text>
  <text class="cost" x="176" y="292" fill="#b91c1c">WRITE = O(followers)</text>

  <!-- PULL -->
  <rect x="312" y="72" width="276" height="230" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text class="hd" x="332" y="96" fill="#14532d">PULL — fan-out on read</text>
  <rect x="336" y="110" width="70" height="26" rx="5" fill="#16a34a"/>
  <text class="n" x="371" y="127" text-anchor="middle">post</text>
  <rect x="418" y="110" width="140" height="26" rx="5" fill="#bbf7d0"/>
  <text class="n" x="488" y="127" text-anchor="middle" fill="#14532d">author's own list only</text>

  <rect x="336" y="168" width="70" height="26" rx="5" fill="#0f766e"/>
  <text class="n" x="371" y="185" text-anchor="middle">reader</text>
  <g stroke="#16a34a" stroke-width="1.5">
    <line x1="406" y1="181" x2="464" y2="160"/><line x1="406" y1="181" x2="464" y2="184"/>
    <line x1="406" y1="181" x2="464" y2="208"/><line x1="406" y1="181" x2="464" y2="232"/>
  </g>
  <g fill="#4ade80">
    <rect x="468" y="152" width="90" height="16" rx="3"/><rect x="468" y="176" width="90" height="16" rx="3"/>
    <rect x="468" y="200" width="90" height="16" rx="3"/><rect x="468" y="224" width="90" height="16" rx="3"/>
  </g>
  <text class="sm" x="513" y="164" text-anchor="middle" fill="#fff">query each followee</text>
  <text class="sm" x="513" y="256" text-anchor="middle">then merge-sort at read time</text>
  <text class="cost" x="332" y="292" fill="#15803d">WRITE = O(1) ✔</text>
  <text class="cost" x="460" y="292" fill="#b91c1c">READ = O(followees)</text>

  <!-- HYBRID -->
  <rect x="600" y="72" width="276" height="230" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text class="hd" x="620" y="96" fill="#92400e">HYBRID — the production answer</text>

  <rect x="620" y="112" width="112" height="24" rx="5" fill="#2563eb"/>
  <text class="n" x="676" y="128" text-anchor="middle">normal user posts</text>
  <text class="sm" x="742" y="128">→ PUSH</text>

  <rect x="620" y="146" width="112" height="24" rx="5" fill="#dc2626"/>
  <text class="n" x="676" y="162" text-anchor="middle">celebrity posts</text>
  <text class="sm" x="742" y="162">→ no fan-out</text>

  <rect x="620" y="192" width="236" height="24" rx="5" fill="#94a3b8"/>
  <text class="n" x="738" y="208" text-anchor="middle">READ = precomputed timeline  ⊕  pull celebs</text>
  <rect x="620" y="222" width="236" height="24" rx="5" fill="#d97706"/>
  <text class="n" x="738" y="238" text-anchor="middle">merge · dedup · sort by time-sortable ID</text>

  <text class="b" x="620" y="266">Threshold ≈ 100 K followers. Both costs stay bounded:</text>
  <text class="b" x="620" y="282">writes never explode, reads touch only a handful of celebs.</text>

  <!-- the celebrity problem -->
  <rect x="24" y="316" width="418" height="92" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text class="hd" x="44" y="338" fill="#991b1b">The celebrity problem, in numbers</text>
  <text class="b" x="44" y="358">A user with 100 M followers posting once = 100 M timeline writes.</text>
  <text class="b" x="44" y="376">At 1 M writes/s that is <tspan font-weight="700">100 seconds of your entire fan-out fleet</tspan> for one tweet.</text>
  <text class="b" x="44" y="394">Ten celebrities posting together = a self-inflicted outage. Pure push cannot work.</text>

  <rect x="458" y="316" width="418" height="92" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text class="hd" x="478" y="338" fill="#14532d">Optimizations that actually move the needle</text>
  <text class="b" x="478" y="358">• <tspan font-weight="700">Fan out to active users only</tspan> (30-day login) — typically cuts 60–80% of writes.</text>
  <text class="b" x="478" y="376">• <tspan font-weight="700">Cap timelines at ~800 IDs</tspan>; deeper pages fall back to the pull path.</text>
  <text class="b" x="478" y="394">• <tspan font-weight="700">Store IDs, not content</tspan> — ~400× less memory, and content is shared.</text>
</svg>
