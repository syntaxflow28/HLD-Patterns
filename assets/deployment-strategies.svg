<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Deployment strategies: rolling, blue-green, canary and feature flags">
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .ttl{font-size:18px;font-weight:700;fill:#0f172a}
    .sub{font-size:12.5px;fill:#64748b}
    .hd{font-size:13px;font-weight:700;fill:#0f172a}
    .b{font-size:11px;fill:#334155}
    .sm{font-size:10px;fill:#64748b}
    .n{font-size:10px;font-weight:700;fill:#ffffff}
    .t{font-size:9.5px;fill:#94a3b8}
  </style>
  <rect width="900" height="380" fill="#fbfcfd"/>
  <text class="ttl" x="24" y="32">Deployment strategies — blast radius vs cost vs rollback speed</text>
  <text class="sub" x="24" y="52">Bad deploys are the single largest cause of outages. This slide is your answer to “how do you ship it safely?”</text>

  <!-- ROLLING -->
  <rect x="24" y="72" width="418" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="hd" x="44" y="94">Rolling</text>
  <text class="sm" x="110" y="94">replace in batches · no extra cost · slow rollback</text>
  <g>
    <text class="t" x="44" y="118">t0</text>
    <rect x="70" y="106" width="26" height="16" rx="3" fill="#94a3b8"/><rect x="100" y="106" width="26" height="16" rx="3" fill="#94a3b8"/>
    <rect x="130" y="106" width="26" height="16" rx="3" fill="#94a3b8"/><rect x="160" y="106" width="26" height="16" rx="3" fill="#94a3b8"/>
    <text class="t" x="44" y="142">t1</text>
    <rect x="70" y="130" width="26" height="16" rx="3" fill="#2563eb"/><rect x="100" y="130" width="26" height="16" rx="3" fill="#2563eb"/>
    <rect x="130" y="130" width="26" height="16" rx="3" fill="#94a3b8"/><rect x="160" y="130" width="26" height="16" rx="3" fill="#94a3b8"/>
    <text class="t" x="44" y="166">t2</text>
    <rect x="70" y="154" width="26" height="16" rx="3" fill="#2563eb"/><rect x="100" y="154" width="26" height="16" rx="3" fill="#2563eb"/>
    <rect x="130" y="154" width="26" height="16" rx="3" fill="#2563eb"/><rect x="160" y="154" width="26" height="16" rx="3" fill="#2563eb"/>
  </g>
  <text class="b" x="206" y="120">⚠ Two versions serve traffic simultaneously.</text>
  <text class="b" x="206" y="138">Every schema and API change must therefore</text>
  <text class="b" x="206" y="156">be <tspan font-weight="700">backward compatible</tspan> — no exceptions.</text>
  <text class="sm" x="44" y="192">Rollback = another full rolling pass. Minutes, not seconds.</text>

  <!-- BLUE GREEN -->
  <rect x="458" y="72" width="418" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="hd" x="478" y="94">Blue / Green</text>
  <text class="sm" x="566" y="94">flip the LB · instant rollback · 2× infra cost</text>
  <rect x="478" y="108" width="60" height="60" rx="6" fill="#64748b"/>
  <text class="n" x="508" y="134" text-anchor="middle">LB</text>
  <text class="n" x="508" y="150" text-anchor="middle">100%</text>
  <rect x="580" y="106" width="120" height="26" rx="5" fill="#2563eb"/>
  <text class="n" x="640" y="123" text-anchor="middle">BLUE (v1) — live</text>
  <rect x="580" y="144" width="120" height="26" rx="5" fill="#86efac"/>
  <text class="n" x="640" y="161" text-anchor="middle" fill="#14532d">GREEN (v2) — idle</text>
  <path d="M538,132 L576,119" stroke="#2563eb" stroke-width="2"/>
  <path d="M538,140 L576,157" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 3"/>
  <text class="b" x="712" y="124">One DNS/LB switch</text>
  <text class="b" x="712" y="142">= instant cutover</text>
  <text class="b" x="712" y="160">and instant rollback.</text>
  <text class="sm" x="478" y="192">Hard part: the database. Both colours share it, so migrations must still be expand/contract.</text>

  <!-- CANARY -->
  <rect x="24" y="216" width="418" height="146" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text class="hd" x="44" y="238">Canary — best risk / cost trade-off</text>
  <line x1="60" y1="320" x2="410" y2="320" stroke="#cbd5e1"/>
  <rect x="60" y="312" width="60" height="8" rx="2" fill="#16a34a"/>
  <rect x="130" y="300" width="60" height="20" rx="2" fill="#16a34a"/>
  <rect x="200" y="276" width="60" height="44" rx="2" fill="#16a34a"/>
  <rect x="270" y="252" width="60" height="68" rx="2" fill="#16a34a"/>
  <rect x="340" y="248" width="70" height="72" rx="2" fill="#15803d"/>
  <g class="t" text-anchor="middle" fill="#166534">
    <text x="90" y="308">1%</text><text x="160" y="296">5%</text><text x="230" y="272">25%</text><text x="300" y="248">50%</text><text x="375" y="244">100%</text>
  </g>
  <text class="sm" x="60" y="336">automated metric gate between every step: error rate · p99 · saturation · key business metric</text>
  <text class="b" x="60" y="354">A bad build harms 1% of users for 5 minutes instead of 100% of users for 30.</text>

  <!-- FEATURE FLAGS -->
  <rect x="458" y="216" width="418" height="146" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="hd" x="478" y="238">Feature flags — deploy ≠ release</text>
  <rect x="478" y="252" width="170" height="26" rx="5" fill="#2563eb"/>
  <text class="n" x="563" y="269" text-anchor="middle">code deployed (flag OFF)</text>
  <path d="M652,265 L676,265" stroke="#2563eb" stroke-width="2" marker-end="url(#f1)"/>
  <defs><marker id="f1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker></defs>
  <rect x="680" y="252" width="176" height="26" rx="5" fill="#16a34a"/>
  <text class="n" x="768" y="269" text-anchor="middle">enabled for 1% / internal / cohort</text>
  <text class="b" x="478" y="298">• Ship dark, release later — decouples the risky moment from the deploy.</text>
  <text class="b" x="478" y="316">• Kill switch takes <tspan font-weight="700">seconds</tspan>, no rebuild, no rollback pipeline.</text>
  <text class="b" x="478" y="334">• Enables trunk-based development and long-running migrations.</text>
  <text class="sm" x="478" y="352">Cost: flag debt. Every flag needs an owner and an expiry date, or you get untestable combinatorics.</text>
</svg>
